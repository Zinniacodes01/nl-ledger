<svg xmlns="http://www.w3.org/2000/svg" class="nlchart" viewBox="0 0 360 496" role="img" aria-label="Bars from the original estimate. Industry, Energy and Technology spent 23.5% under; Health and Community Services 2.3% over."><style>
.nlchart{--paper:#fcfcfa;--ink:#14171a;--ink2:#454b52;--ink3:#676d74;--hair:#d3d6d1;--bar:#2f57c4;--red:#b3261e;--graphite:#59606a;font-family:Archivo,ui-sans-serif,system-ui,sans-serif}
@media (prefers-color-scheme:dark){.nlchart{--paper:#0f1215;--ink:#eceeea;--ink2:#b9bfc6;--ink3:#8f969d;--hair:#2e343a;--bar:#5f86ea;--red:#ff8d84;--graphite:#9aa2ab}}
.nlchart .bg{fill:var(--paper)}.nlchart .t{fill:var(--ink);font-weight:850;font-stretch:72%;text-transform:uppercase;letter-spacing:.012em;font-size:23px}
.nlchart .h{fill:var(--ink2);font-weight:800;font-stretch:78%;text-transform:uppercase;letter-spacing:.07em;font-size:11px}
.nlchart .l{fill:var(--ink);font-size:14px;font-stretch:90%}.nlchart .n{fill:var(--ink);font-size:14px;font-variant-numeric:tabular-nums lining-nums}
.nlchart .neg{fill:var(--red)}.nlchart .a{fill:var(--ink);font-size:12.5px;font-weight:600;font-stretch:85%}.nlchart .s{fill:var(--ink3);font-size:11px;font-stretch:90%}
.nlchart .bar{fill:var(--bar)}.nlchart .hair{stroke:var(--hair)}.nlchart .rule{stroke:var(--ink)}.nlchart .lead{stroke:var(--graphite);fill:none}
</style><rect class="bg" width="360" height="496"/><title>Bars from the original estimate. Industry, Energy and Technology spent 23.5% under; Health and Community Services 2.3% over.</title><text class="t" x="0" y="22" style="font-size:20px">Industry, Energy and Technology</text><text class="t" x="0" y="44" style="font-size:20px">spent 23.5% under its estimate;</text><text class="t" x="0" y="66" style="font-size:20px">Health spent 2.3% over</text><text class="h" x="0" y="113">Department</text><text class="h" x="360" y="113" text-anchor="end">vs estimate</text><line class="rule" x1="0" x2="360" y1="122" y2="122" stroke-width="1.5"/><text class="h" x="249" y="96" text-anchor="end">Spent less</text><text class="h" x="259" y="96">Spent more</text><text class="l" x="0" y="143" style="font-size:13.5px">Children, Seniors and Social Dev.</text><text class="n" x="360" y="143" text-anchor="end" style="font-size:13.5px">+6.6%</text><path class="bar" d="M254.0 151H306.2a4 4 0 0 1 4 4v0a4 4 0 0 1 -4 4H254.0z"/><line class="hair" x1="0" x2="360" y1="168" y2="168"/><text class="l" x="0" y="189" style="font-size:13.5px">Transportation and Infrastructure</text><text class="n" x="360" y="189" text-anchor="end" style="font-size:13.5px">+5.5%</text><path class="bar" d="M254.0 197H296.8a4 4 0 0 1 4 4v0a4 4 0 0 1 -4 4H254.0z"/><line class="hair" x1="0" x2="360" y1="214" y2="214"/><text class="l" x="0" y="235" style="font-size:13.5px">Health and Community Services</text><text class="n" x="360" y="235" text-anchor="end" style="font-size:13.5px">+2.3%</text><path class="bar" d="M254.0 243H269.8a4 4 0 0 1 4 4v0a4 4 0 0 1 -4 4H254.0z"/><line class="hair" x1="0" x2="360" y1="260" y2="260"/><text class="l" x="0" y="281" style="font-size:13.5px">Consolidated Fund Services</text><text class="n neg" x="360" y="281" text-anchor="end" style="font-size:13.5px">(7.0%)</text><path class="bar" d="M254.0 289H198.7a4 4 0 0 0 -4 4v0a4 4 0 0 0 4 4H254.0z"/><line class="hair" x1="0" x2="360" y1="306" y2="306"/><text class="l" x="0" y="327" style="font-size:13.5px">Executive Council</text><text class="n neg" x="360" y="327" text-anchor="end" style="font-size:13.5px">(13.4%)</text><path class="bar" d="M254.0 335H144.6a4 4 0 0 0 -4 4v0a4 4 0 0 0 4 4H254.0z"/><line class="hair" x1="0" x2="360" y1="352" y2="352"/><text class="l" x="0" y="373" style="font-size:13.5px">Industry, Energy and Technology</text><text class="n neg" x="360" y="373" text-anchor="end" style="font-size:13.5px">(23.5%)</text><path class="bar" d="M254.0 381H58.9a4 4 0 0 0 -4 4v0a4 4 0 0 0 4 4H254.0z"/><text class="a" x="0" y="410">$131.6M spent of $172.1M planned</text><line class="hair" x1="0" x2="360" y1="418" y2="418"/><line class="rule" x1="254" x2="254" y1="118" y2="418" stroke-width="1.5"/><text class="s" x="0" y="442">Actual spending against the original estimate,</text><text class="s" x="0" y="456">current account. Source: Report on the Program</text><text class="s" x="0" y="470">Expenditures and Revenues of the Consolidated</text><text class="s" x="0" y="484">Revenue Fund, 2024-25.</text></svg>
