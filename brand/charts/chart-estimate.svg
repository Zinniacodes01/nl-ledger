<svg xmlns="http://www.w3.org/2000/svg" class="nlchart" viewBox="0 0 720 380" role="img" aria-label="Bars from the original estimate. Industry, Energy and Technology spent 23.5% under; Health and Community Services 2.3% over."><style>
.nlchart{--paper:#fcfcfa;--ink:#14171a;--ink2:#454b52;--ink3:#676d74;--hair:#d3d6d1;--bar:#2f57c4;--red:#b3261e;--graphite:#59606a;font-family:Archivo,ui-sans-serif,system-ui,sans-serif}
@media (prefers-color-scheme:dark){.nlchart{--paper:#0f1215;--ink:#eceeea;--ink2:#b9bfc6;--ink3:#8f969d;--hair:#2e343a;--bar:#5f86ea;--red:#ff8d84;--graphite:#9aa2ab}}
.nlchart .bg{fill:var(--paper)}.nlchart .t{fill:var(--ink);font-weight:850;font-stretch:72%;text-transform:uppercase;letter-spacing:.012em;font-size:23px}
.nlchart .h{fill:var(--ink2);font-weight:800;font-stretch:78%;text-transform:uppercase;letter-spacing:.07em;font-size:11px}
.nlchart .l{fill:var(--ink);font-size:14px;font-stretch:90%}.nlchart .n{fill:var(--ink);font-size:14px;font-variant-numeric:tabular-nums lining-nums}
.nlchart .neg{fill:var(--red)}.nlchart .a{fill:var(--ink);font-size:12.5px;font-weight:600;font-stretch:85%}.nlchart .s{fill:var(--ink3);font-size:11px;font-stretch:90%}
.nlchart .bar{fill:var(--bar)}.nlchart .hair{stroke:var(--hair)}.nlchart .rule{stroke:var(--ink)}.nlchart .lead{stroke:var(--graphite);fill:none}
</style><rect class="bg" width="720" height="380"/><title>Bars from the original estimate. Industry, Energy and Technology spent 23.5% under; Health and Community Services 2.3% over.</title><text class="t" x="0" y="28">Industry, Energy and Technology spent 23.5%</text><text class="t" x="0" y="54">under its estimate; Health spent 2.3% over</text><text class="h" x="0" y="98">Department</text><text class="h" x="464" y="98" text-anchor="end">Spent less</text><text class="h" x="476" y="98">Spent more</text><text class="h" x="720" y="98" text-anchor="end">vs estimate</text><line class="rule" x1="0" x2="720" y1="108" y2="108" stroke-width="1.5"/><line class="hair" x1="0" x2="720" y1="144" y2="144"/><text class="l" x="0" y="131">Children, Seniors and Social Dev.</text><path class="bar" d="M470.0 122H516.9a4 4 0 0 1 4 4v0a4 4 0 0 1 -4 4H470.0z"/><text class="n" x="720" y="131" text-anchor="end">+6.6%</text><line class="hair" x1="0" x2="720" y1="180" y2="180"/><text class="l" x="0" y="167">Transportation and Infrastructure</text><path class="bar" d="M470.0 158H508.3a4 4 0 0 1 4 4v0a4 4 0 0 1 -4 4H470.0z"/><text class="n" x="720" y="167" text-anchor="end">+5.5%</text><line class="hair" x1="0" x2="720" y1="216" y2="216"/><text class="l" x="0" y="203">Health and Community Services</text><path class="bar" d="M470.0 194H483.9a4 4 0 0 1 4 4v0a4 4 0 0 1 -4 4H470.0z"/><text class="n" x="720" y="203" text-anchor="end">+2.3%</text><line class="hair" x1="0" x2="720" y1="252" y2="252"/><text class="l" x="0" y="239">Consolidated Fund Services</text><path class="bar" d="M470.0 230H420.3a4 4 0 0 0 -4 4v0a4 4 0 0 0 4 4H470.0z"/><text class="n neg" x="720" y="239" text-anchor="end">(7.0%)</text><line class="hair" x1="0" x2="720" y1="288" y2="288"/><text class="l" x="0" y="275">Executive Council</text><path class="bar" d="M470.0 266H371.3a4 4 0 0 0 -4 4v0a4 4 0 0 0 4 4H470.0z"/><text class="n neg" x="720" y="275" text-anchor="end">(13.4%)</text><line class="hair" x1="0" x2="720" y1="324" y2="324"/><text class="l" x="0" y="311">Industry, Energy and Technology</text><path class="bar" d="M470.0 302H293.7a4 4 0 0 0 -4 4v0a4 4 0 0 0 4 4H470.0z"/><text class="n neg" x="720" y="311" text-anchor="end">(23.5%)</text><line class="lead" x1="478" x2="492" y1="306" y2="306"/><text class="a" x="498" y="304">$131.6M spent</text><text class="a" x="498" y="318" style="font-weight:400">of $172.1M planned</text><line class="rule" x1="470" x2="470" y1="104" y2="324" stroke-width="1.5"/><text class="s" x="0" y="350">Actual spending against the original estimate, current account.</text><text class="s" x="0" y="366">Source: Report on the Program Expenditures and Revenues of the Consolidated Revenue Fund, 2024-25.</text></svg>
