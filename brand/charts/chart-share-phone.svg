<svg xmlns="http://www.w3.org/2000/svg" class="nlchart" viewBox="0 0 360 516" role="img" aria-label="Bar chart. Health and Community Services spent $4,463.7 million of $9,830.5 million, 45 cents of every dollar."><style>
.nlchart{--paper:#fcfcfa;--ink:#14171a;--ink2:#454b52;--ink3:#676d74;--hair:#d3d6d1;--bar:#2f57c4;--red:#b3261e;--graphite:#59606a;font-family:Archivo,ui-sans-serif,system-ui,sans-serif}
